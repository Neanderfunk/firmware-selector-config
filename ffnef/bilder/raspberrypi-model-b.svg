<?xml version="1.0" encoding="UTF-8"?>
<!-- Behelf: das vorhandene Foto in einer SVG-Huelle.
     Fuer dieses Geraet gibt es in freifunk/device-pictures keine Zeichnung,
     und der Downloader kann nur EINE Dateiendung global. Damit das Bild beim
     Wechsel auf SVG nicht verschwindet, steckt hier das Original-JPG drin.
     Es sieht aus wie bisher, skaliert aber nicht wie echte Vektoren.
     Ersetzen, sobald eine echte Zeichnung vorliegt. Quelle: das bisherige
     pictures/raspberrypi-model-b.jpg des Downloaders, CC-BY-NC-SA 4.0. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="256" height="256" viewBox="0 0 256 256">
  <image x="0" y="0" width="256" height="256" xlink:href="data:image/jpeg;base64,"/>
</svg>
