# vhost des Firmware-Selectors auf dem Firmware-Server. deploy.sh verknuepft
# diese Datei nach /etc/nginx/sites-enabled/, Ablauf und Fallen wie in
# router.neanderfunk.de.conf (TLS endet vorne auf dem Proxy, hier keine
# Umleitung von http auf https, nicht mit certbot an dieser Datei arbeiten).

server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/beta.ffnef.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beta.ffnef.de/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        server_name routersoftware.neanderfunk.de;
        root /var/www/routersoftware.ffnef.de;
        index index.html;

        include /etc/nginx/bots.d/ddos.conf;
        include /etc/nginx/bots.d/blockbots.conf;
        include /var/www/selector-config/dienst/fehlermeldung-nginx.conf;

        location / {
                try_files $uri $uri/ =404;
                autoindex on;
        }

        location /images {
                autoindex on;
        }
}

# Alte und Nebennamen: bleiben als 301 auf den einen Namen (alte Links,
# Druckmaterial, Anleitungen mit der alten Adresse). /fehler-melden wird
# hier noch angenommen, damit eine vor der Umstellung geladene Seite melden
# kann (ein 301 machte aus dem POST ein GET).
server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/beta.ffnef.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beta.ffnef.de/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        server_name routersoftware.ffnef.de routerfirmware.ffnef.de
                    routerfirmware.neanderfunk.de;

        include /etc/nginx/bots.d/ddos.conf;
        include /etc/nginx/bots.d/blockbots.conf;
        include /var/www/selector-config/dienst/fehlermeldung-nginx.conf;

        location / {
                return 301 https://routersoftware.neanderfunk.de$request_uri;
        }
}
