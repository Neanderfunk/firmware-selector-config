# vhost der Routerwahl auf dem Firmware-Server. deploy.sh verknuepft diese
# Datei nach /etc/nginx/sites-enabled/ und laedt nginx neu, wenn "nginx -t"
# durchgeht; sonst nimmt es den Zeiger wieder weg.
#
# TLS endet vorne auf dem Proxy, der mit unveraendertem Host-Header
# weiterreicht, fuer Port 80 UND 443 an Port 443 hier. Deshalb hier keine
# Umleitung von http auf https: hier kommt alles als https an, die Umleitung
# gehoert auf den Proxy. Das Zertifikat hier sieht nur der Proxy.
#
# Nicht mit certbot an dieser Datei arbeiten: sie liegt im Git-Klon, eine
# Aenderung dort laesst das naechste "merge --ff-only" scheitern.

server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/beta.ffnef.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beta.ffnef.de/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        server_name router.neanderfunk.de;
        root /var/www/routerwahl.ffnef.de;
        index index.html;

        include /etc/nginx/bots.d/ddos.conf;
        include /etc/nginx/bots.d/blockbots.conf;
        include /var/www/selector-config/dienst/fehlermeldung-nginx.conf;

        location / {
                try_files $uri $uri/ =404;
                autoindex on;
        }
}

# Alter Name bis 04.11.2026, steht auf gedrucktem Material: bleibt als 301.
# /fehler-melden wird hier noch angenommen, damit eine vor der Umstellung
# geladene Seite melden kann (ein 301 machte aus dem POST ein GET).
server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        ssl_certificate /etc/letsencrypt/live/beta.ffnef.de/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/beta.ffnef.de/privkey.pem;
        include /etc/letsencrypt/options-ssl-nginx.conf;
        ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

        server_name routerwahl.ffnef.de;

        include /etc/nginx/bots.d/ddos.conf;
        include /etc/nginx/bots.d/blockbots.conf;
        include /var/www/selector-config/dienst/fehlermeldung-nginx.conf;

        location / {
                return 301 https://router.neanderfunk.de$request_uri;
        }
}
